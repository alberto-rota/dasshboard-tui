[package]
name = "dasshboard"
version = "0.2.0"
edition = "2024"
description = "A home screen for your terminal: clickable SSH hosts, in colour-coded Ghostty tabs on macOS and in the current terminal everywhere else"

[[bin]]
name = "dasshboard"
path = "src/main.rs"

[dependencies]
glob = "0.3"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
opt-level = 2
lto = true
strip = true
