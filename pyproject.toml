[build-system]
# maturin builds the Rust binary and packages it as a wheel whose only payload
# is a console script. `uv build` drives it; there is no Python code here.
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dasshboard"
version = "0.2.1"
description = "A home screen for your terminal: clickable SSH hosts, in colour-coded Ghostty tabs on macOS and in the current terminal everywhere else"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ssh", "tui", "ghostty", "terminal", "launcher", "cross-platform"]
# The TUI and both kinds of tile run everywhere. Only *new tabs* need macOS and
# Ghostty; a tile asking for one opens in the current terminal instead, which is
# why this is OS Independent with the three it is actually tested on named
# after it. The Compatibility table in the README -- which is this page on PyPI
# -- is the long form.
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Terminals",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pypi.org/project/dasshboard/"

[tool.maturin]
# The wheel ships the compiled binary as its entry point rather than an
# importable module, so nothing Python-side is generated.
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
